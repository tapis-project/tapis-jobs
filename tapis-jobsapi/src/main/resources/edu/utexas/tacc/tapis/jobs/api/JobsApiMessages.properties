JOBSAPI_LISTTYPE_INVALID=JOBSAPI_LISTTYPE_INVALID Invalid listType for search. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} listType: {4}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = selecstr
JOBSAPI_SELECTLIST_INVALID=JOBSAPI_SELECTLIST_INVALIDE Invalid select string for search. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Select string: {4}
