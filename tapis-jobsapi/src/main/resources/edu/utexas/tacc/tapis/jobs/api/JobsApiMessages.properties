##########################################################################################
# Log messages for Jobs Service
##########################################################################################

# ---------- General -----------
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = class name, 5 = op name, 6 = request URL, 7 = argList
JOBSAPI_TRACE_REQUEST=JOBSAPI_TRACE_REQUEST jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Received by {4}.{5} URL: {6} Args: {7}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = json
JOBSAPI_SUBMIT_TRACE=JOBSAPI_SUBMIT_TRACE jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Json: {4}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUUid, 5 = owner, 6 = name, 7 = status
JOBSAPI_JOB_CREATED=JOBSAPI_JOB_CREATED Job created and persisted to datastore. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Uuid: {4} Owner: {5} Name: {6} Status: {7}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUUid, 5 = owner, 6 = name, 7 = status
JOBSAPI_RESUBMIT_PERSISTED=JOBSAPI_RESUBMIT_PERSISTED Job resubmit data persisted to datastore. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Uuid: {4} Owner: {5} Name: {6} Status: {7}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUUid, 5 = owner, 6 = name, 7 = status, 8 = details as json
JOBSAPI_JOB_DETAILS=JOBSAPI_JOB_DETAILS Resolved details for job at create time. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Uuid: {4} Owner: {5} Name: {6} Status: {7} Details: {8}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid
JOBSAPI_NOT_FOUND=JOBSAPI_NOT_FOUND Job not found. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid
JOBSAPI_NOT_VISIBLE=JOBS_NOT_VISIBLE Job not visible. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid, 5 = job owner, 6 = error msg
JOBSAPI_SUBSCRIPTION_ERROR=JOBSAPI_SUBSCRIPTION_ERROR Unable to create subscription for job. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} JobOwner: {5}  Error: {6}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid, 5 = status
JOBSAPI_IN_TERM_STATE=JOBSAPI_IN_TERM_STATE Job in terminal state. Cannot be cancelled. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} State: {5}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid, 5 = count
JOBSAPI_SUBSCR_CREATED=JOBSAPI_SUBSCR_CREATED All subscriptions created for job. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} Number of subscriptions: {5}

# 0 =job uuid, 1 = path, 2 = user, 3 = tenant
JOBSAPI_NO_OUTPUT_FILES_TO_DOWNLOAD=JOBS_NO_OUTPUT_FILES_TO_DOWNLOAD Unable to download. Job: {0} Path: {1} User: {2} Tenant {3}

# ---------- Job Submit -----------
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUuid
JOBSAPI_POST_MBQ=JOBSAPI_POST_MBQ jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Job submit request sent to MessageBroker worker queue. JobUuid: {4}

# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUuid, 5 = error msg
JOBSAPI_RESUBMIT_NOT_FOUND=JOBSAPI_RESUBMIT_NOT_FOUND jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Job not found in resubmit table. JobUuid: {4} Error: {5}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUuid, 5 = app name, 6 = error message
JOBSAPI_SUBMIT_ERROR1=JOBSAPI_SUBMIT_ERROR1 Error submitting job. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} Application: {5} Error: {6}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid, 5 = error msg
JOBSAPI_RESUBMIT_FAILED_PERSIST=JOBSAPI_RESUBMIT_FAILED_PERSIST Create of resubmit record failed. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} Error: {5}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid
JOBSAPI_ZOMBIE_ERROR=JOBSAPI_ZOMBIE_ERROR Job termination failed, zombie created. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4}

# ----------- Job History -------------
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid
JOBSAPI_EVENT_COUNT=JOBSAPI_EVENT_COUNT Job event count. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} Number of events: {5}

# --------------- Action ------------
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUuid, 5 = visibility
JOBSAPI_VIS_CHANGED=JOBSAPI_VIS_CHANGED Job visibility changed. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {0} Visibility: {1}.
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUuid, 5 = visibility
JOBSAPI_VIS_UNCHANGED=JOBS_VIS_UNCHANGED Job visibility unchanged. Already set to requested value. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} Visibility: {5}
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = jobUuid, 5 = visibility
JOBSAPI_CHANGE_VIS_ERR=JOBSAPI_CHANGE_VIS_ERR Failed to change job visibility. Left unchanged. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} Visibility still: {5}.
# 0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = job uuid, 5 = status
JOBSAPI_NOT_IN_TERM_STATE=JOBSAPI_NOT_IN_TERM_STATE Job not in terminal state. Cannot change visibility. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} JobUuid: {4} State: {5}
#  0 = jwtTenant, 1 = jwtUser, 2 = oboTenant, 3 = oboUser, 4 = operation, 5 = jobOwner, 6 = jobUuid
JOBSAPI_ACTION_NOT_AUTH=JOBS_ACTION_NOT_AUTH. Action on job not authorized. jwtTenant: {0} jwtUser: {1} OboTenant: {2} OboUser: {3} Operation: {4} JobOwner: {5} JobUuid: {6}  

