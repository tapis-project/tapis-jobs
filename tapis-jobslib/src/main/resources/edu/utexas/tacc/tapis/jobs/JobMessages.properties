# This file contains log messages related to the Jobs service. Here are guidelines on how to create new messages:
#
# 1. Use unique and descriptive key names.
#    The key names are used in log statements as in the following example:
#       log.info(MessageUtils.getLocalMsg("TAPIS_INITIALIZING_SERVICE", "db.migration.db.migration.jobs"));
#    This usage standardizes messages, allows all uses of a message key to be easily discovered, and leaves the
#    door open for national language support.
#           
# 2. Repeat the key name as the first text in the message.
#    This guideline allows log records to be more easily correlated with source code.
#
# 3. Use and document substitution variables to be assigned runtime values.
#     Substitution variables allow meaningful and precise messages to be logged to improve debugging and serviceability
#     in general. Unless incredibly obvious, the semantics of each variable should be documented in a comment
#     immediately preceding the message.
#
# 4. Organize message into groups that make it easier for humans to take in.
#
# 5. Start keys with JOBS_ to distinguish them from messages defined in the shared file TapisMessages.properties.

